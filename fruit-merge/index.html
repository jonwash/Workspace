<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fruit Merge</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1a1029;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: system-ui, sans-serif;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    width: min(100vw, calc(100vh * 480 / 720));
    height: min(100vh, calc(100vw * 720 / 480));
    width: min(100dvw, calc(100dvh * 480 / 720));
    height: min(100dvh, calc(100dvw * 720 / 480));
    display: block;
    border-radius: 8px;
    box-shadow: 0 10px 60px rgba(0,0,0,.6);
    cursor: pointer;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Logical resolution
const W = 480, H = 720;
const WALL = 12;                 // wall thickness
const LEFT = WALL, RIGHT = W - WALL, FLOOR = H - 16;
const DANGER_Y = 150;            // lose if fruit rests above this line
const SPAWN_Y = 95;
const GRAV = 2000;
const REST = 0.15;               // restitution
const DROP_COOLDOWN = 450;       // ms

const TIERS = [
  { r: 15,  c1: '#ff6b81', c2: '#b3232f', score: 1,  name: 'Cherry'     },
  { r: 21,  c1: '#ff8a7a', c2: '#d63b1f', score: 3,  name: 'Strawberry' },
  { r: 28,  c1: '#c56cf0', c2: '#7d3aa3', score: 6,  name: 'Grape'      },
  { r: 34,  c1: '#ffd32a', c2: '#c79106', score: 10, name: 'Dekopon'    },
  { r: 42,  c1: '#ffa502', c2: '#cc6c10', score: 15, name: 'Orange'     },
  { r: 50,  c1: '#ff4757', c2: '#a52a12', score: 21, name: 'Apple'      },
  { r: 60,  c1: '#d2e04e', c2: '#8a9a14', score: 28, name: 'Pear'       },
  { r: 70,  c1: '#ffb8c6', c2: '#d95f83', score: 36, name: 'Peach'      },
  { r: 81,  c1: '#ffdd59', c2: '#c19a12', score: 45, name: 'Pineapple'  },
  { r: 93,  c1: '#a8e063', c2: '#4c9428', score: 55, name: 'Melon'      },
  { r: 106, c1: '#2ecc71', c2: '#135c2e', score: 66, name: 'Watermelon' },
];

// ---------- state ----------
let fruits = [];        // {x,y,vx,vy,r,tier,angle,va,age,warn,dead}
let particles = [];
let popups = [];
let score = 0;
let best = +(localStorage.getItem('fruitMergeBest') || 0);
let over = false;
let heldTier, nextTier;
let aimX = W / 2;
let canDropTime = 0;
let shake = 0;
let actx = null;

function randTier() {
  const w = [30, 25, 20, 15, 10];   // tiers 0-4 only
  let t = Math.random() * 100;
  for (let i = 0; i < w.length; i++) { t -= w[i]; if (t < 0) return i; }
  return 0;
}

function newFruit(x, y, tier) {
  return { x, y, vx: 0, vy: 0, r: TIERS[tier].r, tier,
           angle: Math.random() * Math.PI * 2, va: 0,
           age: 0, warn: 0, dead: false };
}

function reset() {
  fruits = []; particles = []; popups = [];
  score = 0; over = false; shake = 0;
  heldTier = randTier(); nextTier = randTier();
  canDropTime = 0;
}
reset();

// ---------- sound ----------
function sound(f0, dur, type, vol) {
  if (!actx) return;
  try {
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f0 * 1.8, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) { /* audio is cosmetic */ }
}

// ---------- merging ----------
let mergeQueue = [];
function mergePair(a, b) {
  a.dead = true; b.dead = true;
  const ma = a.r * a.r, mb = b.r * b.r, m = ma + mb;
  const x = (a.x * ma + b.x * mb) / m, y = (a.y * ma + b.y * mb) / m;
  burst(x, y, TIERS[a.tier].c1, a.r);
  if (a.tier === TIERS.length - 1) {          // two watermelons vanish
    score += 200;
    popups.push({ x, y, text: '+200', t: 0 });
    shake = 10;
    sound(120, 0.4, 'sawtooth', 0.2);
    return;
  }
  const t = a.tier + 1;
  const f = newFruit(x, y, t);
  f.x = Math.max(LEFT + f.r, Math.min(RIGHT - f.r, f.x));
  f.y = Math.min(FLOOR - f.r, f.y);
  f.vx = (a.vx * ma + b.vx * mb) / m;
  f.vy = (a.vy * ma + b.vy * mb) / m;
  f.age = 1;                                   // no game-over grace re-run
  mergeQueue.push(f);
  score += TIERS[t].score;
  popups.push({ x, y, text: '+' + TIERS[t].score, t: 0 });
  sound(220 + t * 60, 0.15, 'triangle', 0.18);
  if (t >= 8) shake = Math.max(shake, 6);
}

function burst(x, y, color, r) {
  const n = Math.min(24, 8 + (r / 6) | 0);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 220;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
                     r: 2 + Math.random() * 4, c: color, t: 0 });
  }
}

// ---------- physics ----------
function physics(dt) {
  const SUB = 4, h = dt / SUB;
  for (let s = 0; s < SUB; s++) {
    for (const f of fruits) {
      f.vy += GRAV * h;
      f.x += f.vx * h; f.y += f.vy * h;
      f.angle += f.va * h;
      f.age += h;
    }
    for (let it = 0; it < 3; it++) {
      for (let i = 0; i < fruits.length; i++) {
        const a = fruits[i];
        if (a.dead) continue;
        for (let j = i + 1; j < fruits.length; j++) {
          const b = fruits[j];
          if (b.dead) continue;
          let dx = b.x - a.x, dy = b.y - a.y;
          const rs = a.r + b.r;
          const d2 = dx * dx + dy * dy;
          if (d2 >= rs * rs) continue;
          let d = Math.sqrt(d2);
          if (d < 1e-4) { d = 1e-4; dx = 1e-4; dy = 0; }
          const nx = dx / d, ny = dy / d;
          if (a.tier === b.tier) { mergePair(a, b); break; }
          const ima = 1 / (a.r * a.r), imb = 1 / (b.r * b.r);
          const imSum = ima + imb;
          const corr = (rs - d) / imSum * 0.8;
          a.x -= nx * corr * ima; a.y -= ny * corr * ima;
          b.x += nx * corr * imb; b.y += ny * corr * imb;
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn < 0) {
            const jn = -(1 + REST) * vn / imSum;
            a.vx -= jn * nx * ima; a.vy -= jn * ny * ima;
            b.vx += jn * nx * imb; b.vy += jn * ny * imb;
            const tx = -ny, ty = nx;
            const vt = rvx * tx + rvy * ty;
            const jt = -vt * 0.08 / imSum;
            a.vx -= jt * tx * ima; a.vy -= jt * ty * ima;
            b.vx += jt * tx * imb; b.vy += jt * ty * imb;
            a.va += vt * 0.004; b.va += vt * 0.004;
          }
        }
      }
      // walls & floor
      for (const f of fruits) {
        if (f.dead) continue;
        if (f.x - f.r < LEFT)  { f.x = LEFT + f.r;  if (f.vx < 0) f.vx *= -REST; }
        if (f.x + f.r > RIGHT) { f.x = RIGHT - f.r; if (f.vx > 0) f.vx *= -REST; }
        if (f.y + f.r > FLOOR) {
          f.y = FLOOR - f.r;
          if (f.vy > 0) f.vy *= -REST;
          f.vx *= 0.985;
          f.va = f.vx / f.r;
        }
      }
      if (mergeQueue.length) {
        fruits = fruits.filter(f => !f.dead);
        fruits.push(...mergeQueue);
        mergeQueue = [];
      }
    }
    for (const f of fruits) f.va *= 0.995;
  }

  // game-over: fruit resting above the danger line
  for (const f of fruits) {
    if (f.age > 0.8 && f.y - f.r < DANGER_Y) f.warn += dt;
    else f.warn = 0;
    if (f.warn > 0.9 && !over) {
      over = true;
      best = Math.max(best, score);
      localStorage.setItem('fruitMergeBest', best);
      sound(90, 0.6, 'sawtooth', 0.25);
    }
  }
}

// ---------- input ----------
function clampAim(x, tier) {
  const r = TIERS[tier].r;
  return Math.max(LEFT + r, Math.min(RIGHT - r, x));
}

function canvasX(e) {
  const rect = canvas.getBoundingClientRect();
  return (e.clientX - rect.left) / rect.width * W;
}

function drop() {
  if (over || performance.now() < canDropTime) return;
  const x = clampAim(aimX, heldTier);
  fruits.push(newFruit(x, SPAWN_Y, heldTier));
  heldTier = nextTier;
  nextTier = randTier();
  canDropTime = performance.now() + DROP_COOLDOWN;
  sound(320, 0.07, 'sine', 0.1);
}

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (err) { actx = null; }
  }
  if (over) { reset(); return; }
  aimX = canvasX(e);
});
canvas.addEventListener('pointermove', e => { if (!over) aimX = canvasX(e); });
canvas.addEventListener('pointerup', e => {
  if (!over) { aimX = canvasX(e); drop(); }
});
window.addEventListener('keydown', e => {
  if (over) { if (e.key === ' ' || e.key === 'Enter') reset(); return; }
  if (e.key === 'ArrowLeft')  aimX -= 18;
  if (e.key === 'ArrowRight') aimX += 18;
  if (e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); drop(); }
});

// ---------- drawing ----------
function drawFruit(f, alpha) {
  const T = TIERS[f.tier];
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(f.x, f.y);

  const g = ctx.createRadialGradient(-f.r * 0.35, -f.r * 0.35, f.r * 0.1, 0, 0, f.r);
  g.addColorStop(0, T.c1);
  g.addColorStop(1, T.c2);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, f.r, 0, Math.PI * 2);
  ctx.fill();

  // highlight
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(-f.r * 0.35, -f.r * 0.42, f.r * 0.28, f.r * 0.16, -0.6, 0, Math.PI * 2);
  ctx.fill();

  ctx.rotate(f.angle);

  // leaf + stem
  ctx.fillStyle = '#2d8a3e';
  ctx.beginPath();
  ctx.ellipse(f.r * 0.18, -f.r * 0.88, f.r * 0.22, f.r * 0.11, 0.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#6b4a2b';
  ctx.lineWidth = Math.max(1.5, f.r * 0.06);
  ctx.beginPath();
  ctx.moveTo(0, -f.r * 0.75);
  ctx.lineTo(0, -f.r * 0.98);
  ctx.stroke();

  // face
  const er = Math.max(1.5, f.r * 0.07);
  ctx.fillStyle = 'rgba(40,20,20,0.85)';
  ctx.beginPath(); ctx.arc(-f.r * 0.28, -f.r * 0.05, er, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc( f.r * 0.28, -f.r * 0.05, er, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(40,20,20,0.85)';
  ctx.lineWidth = Math.max(1.5, f.r * 0.05);
  ctx.beginPath();
  ctx.arc(0, f.r * 0.12, f.r * 0.22, 0.25, Math.PI - 0.25);
  ctx.stroke();

  ctx.restore();
}

function draw(now) {
  ctx.save();
  if (shake > 0.5) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  // background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#2b1a4d');
  bg.addColorStop(1, '#160d29');
  ctx.fillStyle = bg;
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // container
  ctx.fillStyle = '#f6e3b8';
  ctx.fillRect(0, DANGER_Y - 30, WALL, H);
  ctx.fillRect(W - WALL, DANGER_Y - 30, WALL, H);
  ctx.fillRect(0, FLOOR, W, H - FLOOR);
  ctx.fillStyle = 'rgba(246,227,184,0.07)';
  ctx.fillRect(LEFT, DANGER_Y - 30, RIGHT - LEFT, FLOOR - DANGER_Y + 30);

  // danger line
  const nearDanger = fruits.some(f => f.y - f.r < DANGER_Y + 90 && f.age > 0.5);
  const warning = fruits.some(f => f.warn > 0.15);
  if (nearDanger || warning) {
    ctx.strokeStyle = warning && (now / 150 | 0) % 2 === 0
      ? 'rgba(255,60,60,0.95)' : 'rgba(255,120,120,0.45)';
    ctx.lineWidth = 2;
    ctx.setLineDash([10, 8]);
    ctx.beginPath();
    ctx.moveTo(LEFT, DANGER_Y);
    ctx.lineTo(RIGHT, DANGER_Y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // aim guide + held fruit
  if (!over) {
    const hx = clampAim(aimX, heldTier);
    const cooling = performance.now() < canDropTime;
    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 10]);
    ctx.beginPath();
    ctx.moveTo(hx, SPAWN_Y);
    ctx.lineTo(hx, FLOOR);
    ctx.stroke();
    ctx.setLineDash([]);
    drawFruit({ x: hx, y: SPAWN_Y, r: TIERS[heldTier].r, tier: heldTier, angle: 0 },
              cooling ? 0.35 : 1);
  }

  // fruits
  for (const f of fruits) drawFruit(f, 1);

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / 0.6);
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // popups
  ctx.textAlign = 'center';
  ctx.font = 'bold 22px system-ui, sans-serif';
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, 1 - p.t / 0.9);
    ctx.fillStyle = '#ffe38a';
    ctx.fillText(p.text, p.x, p.y - p.t * 50);
  }
  ctx.globalAlpha = 1;

  // HUD
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.fillText(score, 24, 44);
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('BEST ' + best, 24, 66);

  // next preview
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '12px system-ui, sans-serif';
  ctx.fillText('NEXT', W - 46, 26);
  const nr = Math.min(16, TIERS[nextTier].r);
  drawFruit({ x: W - 46, y: 48, r: nr, tier: nextTier, angle: 0 }, 1);

  // evolution chart
  let cx = W / 2 - 92;
  for (let i = 0; i < TIERS.length; i++) {
    const rr = 4 + i * 1.1;
    ctx.fillStyle = TIERS[i].c1;
    ctx.beginPath();
    ctx.arc(cx, 30, rr, 0, Math.PI * 2);
    ctx.fill();
    cx += rr * 2 + 4;
  }

  // game over
  if (over) {
    ctx.fillStyle = 'rgba(10,5,20,0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 46px system-ui, sans-serif';
    ctx.fillText('Game Over', W / 2, H / 2 - 60);
    ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.fillStyle = '#ffe38a';
    ctx.fillText(score + ' pts', W / 2, H / 2 - 10);
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('Best: ' + best, W / 2, H / 2 + 24);
    if ((now / 600 | 0) % 2 === 0) {
      ctx.fillText('Tap or press Space to restart', W / 2, H / 2 + 70);
    }
  }

  ctx.restore();
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  let dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;

  if (!over) physics(dt);

  for (const p of particles) {
    p.t += dt;
    p.vy += 900 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  particles = particles.filter(p => p.t < 0.6);
  for (const p of popups) p.t += dt;
  popups = popups.filter(p => p.t < 0.9);
  shake = Math.max(0, shake - dt * 30);

  draw(now);
  requestAnimationFrame(frame);
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
